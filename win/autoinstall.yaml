#cloud-config
# autoinstall.yaml v3 — неинтерактивная установка Kubuntu для флешки «два тома,
# одна система». Используется способом B: build-all.bat -> QEMU -> запись на USB.
#
# ВАЖНО: сам по себе этот файл ничего не запускает. Параметр `autoinstall`
# обязан попасть в командную строку ЯДРА, которую QEMU передаёт через
# -kernel/-initrd/-append (см. win/build-all.ps1, стадия 5). Раньше он
# «добавлялся» в bootcmd — так не работает: bootcmd выполняется, когда
# инсталлятор уже запущен и уже прочитал cmdline.
#
# Разметка целевого диска (GPT):
#   P0  1 МБ   bios-boot   — нативная загрузка в режиме Legacy BIOS
#   P1  2 GiB  FAT32 ESP «FLASHCARD» (точка монтирования /boot/efi)
#                              → нативная UEFI-загрузка + данные тома P1 (QEMU, доки).
#                              ФИЗИЧЕСКИЙ ТОМ P1 — для Windows это «съёмный диск».
#   P2  остаток ext4  «/»  — ЕДИНСТВЕННАЯ система (нативный запуск и QEMU-кнопка).
#
# Диск подключается к QEMU как if=virtio, поэтому в гостевой системе он /dev/vda.
# Указывать путь нельзя (ломается при другой разметке хоста) — выбираем «самый
# большой диск»: cdrom-образы в кандидаты не попадают, диск в ВМ ровно один.
#
# Размер томов меняются ОДНОВРЕМЕННО здесь (size) и в build-all.ps1
# ($EspGb, $DiskSizeGb), чтобы предупреждения о флешке оставались честными.
#
# Пакеты разделены:
#   packages:      — базовый рабочий стол и повседневные инструменты
#   late-commands: — репозитории, браузер, настройки, GRUB
#   first-boot:    — тяжёлый стек (docker, golang, rust, node, jupyter,
#                    libreoffice, postgresql, IDE) ставится при ПЕРВОМ запуске,
#                    скриптом /usr/local/bin/first-boot-setup.sh
#                    → установка не срывается из-за обрыва сети и идёт быстро.

autoinstall:
  version: 1

  # Не выводить интерактивные секции и не предлагать обновление установщика
  interactive-sections: []
  refresh-installer:
    update: false

  identity:
    realname: Студент
    username: student
    password: "$6$Fjz3CC76unT00BkU$iLSDclxuxU3XkTAuxruXLkGGWMgxQtmUlJYWYLJWzTeI9vhETnzKBcVs9wYfAT0tMFfPx2GjQrGyRtNS2cpgl1"
    hostname: kubuntu

  # Сеть: имя интерфейса НЕ фиксируем (enp*/eno*/ens* — почти все сетевые карты
  # и всех версий), DHCP по IPv4. Такой конфиг одинаково работает и в QEMU
  # (virtio), и на реальном ноутбуке при нативной загрузке с флешки.
  network:
    version: 2
    ethernets:
      primary:
        match:
          name: "en*"
        dhcp4: true
        dhcp6: false
        accept-ra: false

  # --- Диагностика на старте инсталлятора (пишется в install.log хоста) -----
  # Строки с префиксом [PF: ] — «свои» метки, по ним видно, что конфигурация
  # дошла до гостя, seed найден, диск виден.
  early-commands:
    - 'echo "[PF: ] ===== installer early-commands ====="'
    - 'echo "[PF: ] cmdline: $(cat /proc/cmdline)"'
    - 'echo "[PF: ] seed CIDATA: $(blkid -t LABEL=CIDATA 2>/dev/null | head -1 || true)"'
    - 'echo "[PF: ] disk: $(lsblk -d -n -o NAME,SIZE 2>/dev/null | tr "\n" " ")"'
    - 'echo "[PF: ] net: $(ip -br link 2>/dev/null | tr "\n" " ")"'

  locale: ru_RU.UTF-8
  keyboard:
    layout: "us,ru"
    variant: ","
    toggle: alt_shift_toggle

  timezone: Europe/Moscow

  # --- Разметка диска: «два тома, одна система» ---
  storage:
    config:
      - id: disk-main
        type: disk
        ptable: gpt
        match:
          size: largest
        wipe: superblock-recursive
        preserve: false
        name: flashcard-root
      - id: part-bios
        type: partition
        device: disk-main
        size: 1M
        flag: bios_grub
      - id: part-esp
        type: partition
        device: disk-main
        size: 2048M
        flag: boot
        grub_device: true
      - id: fmt-esp
        type: format
        volume: part-esp
        fstype: vfat
        label: FLASHCARD
      - id: mnt-esp
        type: mount
        device: fmt-esp
        path: /boot/efi
      - id: part-root
        type: partition
        device: disk-main
        size: -1
      - id: fmt-root
        type: format
        volume: part-root
        fstype: ext4
        label: kubuntu-root
      - id: mnt-root
        type: mount
        device: fmt-root
        path: /

  # --- Базовые пакеты: ставятся самим инсталлятором, попадают в образ ------
  # Рабочий стол и то, что нужно на первой-второй минуте. Тяжёлый стек — в
  # first-boot-setup.sh, иначе установка идёт часами и срывается обрывом сети.
  packages:
    - kubuntu-desktop
    - curl
    - git
    - software-properties-common
    - python3
    - python3-pip
    - python3-venv
    - gcc
    - g++
    - make
    - sqlite3
    - vim
    - neovim
    - default-jdk

  # --- Поздние команды (в целевой системе, перед выключением) ---------------
  late-commands:
    # 1/9. Временный рабочий DNS для chroot
    - 'echo "[PF: ] 1/9 DNS для chroot"'
    - sh -c "echo 'nameserver 1.1.1.1' > /target/etc/resolv.conf"
    - sh -c "echo 'nameserver 8.8.8.8' >> /target/etc/resolv.conf"

    # 2/9. Репозитории без промежуточных фоновых обновлений (экономия времени)
    - 'echo "[PF: ] 2/9 подключаю PPA и universe/multiverse"'
    - curtin in-target -- add-apt-repository -y --no-update ppa:mozillateam/ppa
    - curtin in-target -- add-apt-repository -y --no-update universe
    - curtin in-target -- add-apt-repository -y --no-update multiverse

    # 3/9. Приоритет Firefox из PPA (deb) вместо Snap
    - 'echo "[PF: ] 3/9 Firefox: deb вместо snap"'
    - |
      sh -c "printf 'Package: firefox*\nPin: release o=LP-PPA-mozillateam\nPin-Priority: 1001\n' > /target/etc/apt/preferences.d/mozilla"

    # 4/9. Один общий апдейт после добавления всех источников
    - 'echo "[PF: ] 4/9 apt-get update"'
    - curtin in-target -- apt-get update

    # 5/9. Недорогая доводка образа
    - 'echo "[PF: ] 5/9 доделываю образ (обои, шрифты, локализация)"'
    - curtin in-target -- env DEBIAN_FRONTEND=noninteractive apt-get install -y fonts-dejavu fonts-liberation2 htop tree unzip zip
    - curtin in-target -- env DEBIAN_FRONTEND=noninteractive apt-get install -y language-pack-ru language-pack-gnome-ru

    # 6/9. Графический интерфейс по умолчанию (KDE SDDM)
    - 'echo "[PF: ] 6/9 графический интерфейс по умолчанию"'
    - curtin in-target -- systemctl set-default graphical.target

    # 7/9. Русская локаль
    - 'echo "[PF: ] 7/9 русская локаль"'
    - curtin in-target -- locale-gen ru_RU.UTF-8
    - curtin in-target -- update-locale LANG=ru_RU.UTF-8

    # 8/9. UEFI-fallback \EFI\BOOT\BOOTX64.EFI: нужен и для нативной загрузки
    #      с флешки через boot-меню, и для QEMU-кнопки (там нет NVRAM-записи).
    - 'echo "[PF: ] 8/9 BOOTX64.EFI для загрузки с флешки"'
    - sh -c "if [ -d /target/boot/efi/EFI/ubuntu ]; then mkdir -p /target/boot/efi/EFI/BOOT; if [ -f /target/boot/efi/EFI/ubuntu/shimx64.efi ]; then cp /target/boot/efi/EFI/ubuntu/shimx64.efi /target/boot/efi/EFI/BOOT/BOOTX64.EFI; else cp /target/boot/efi/EFI/ubuntu/grubx64.efi /target/boot/efi/EFI/BOOT/BOOTX64.EFI; fi; fi"

    # 9/9. Serial-консоль в GRUB установленной системы.
    #      Нужна, чтобы стадия 6 (smoke) и запуск QEMU с флешки видели загрузку
    #      в логе. Повторное присваивание переменной в /etc/default/grub
    #      перекрывает предыдущее (файл читается как shell), quiet/splash
    #      нам не нужны — с ними в лог почти ничего не попадает.
    - 'echo "[PF: ] 9/9 serial-консоль и установка сервиса первого запуска"'
    - 'echo "GRUB_CMDLINE_LINUX_DEFAULT=\"console=tty0 console=ttyS0,115200n8\"" >> /target/etc/default/grub'
    - curtin in-target -- update-grub

    # --- Скрипт ПЕРВОГО запуска: тяжёлые пакеты, snap, IDE ------------------
    # Отдельный сервис, чтобы пережить обрыв сети и перезагрузку: одна упавшая
    # установка пакета не должна оставлять систему на середине.
    - |
      cat << 'PFEOF' > /target/usr/local/bin/first-boot-setup.sh
      #!/bin/bash
      # Тяжёлый стек ставится при ПЕРВОМ запуске, а не во время установки:
      # так сборка флешки быстрее и не срывается из-за сети.
      # Всё, что печатается, идёт одновременно на экран и в
      # /var/log/first-boot-setup.log.
      set +e
      LOG=/var/log/first-boot-setup.log
      FAILED=""
      OKN=0
      BADN=0

      exec > >(tee -a "$LOG") 2>&1

      log() { echo "[$(date '+%H:%M:%S')] $*" | tr -d '\r'; }
      step() { log ""; log "--- $* ---"; }

      pkgs() {
        # pkgs <имя> <пакет...>: ставит пакеты по одному и пишет итог по каждому
        local name="$1"; shift
        for p in "$@"; do
          log "ставлю $p ..."
          if DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "$p" >>"$LOG" 2>&1; then
            log "  готово: $p"; OKN=$((OKN+1))
          else
            log "  ОШИБКА: $p"; BADN=$((BADN+1)); FAILED="$FAILED $p"
          fi
        done
      }

      log "=========== first boot: начало ==========="
      log "весь вывод этого скрипта сохраняется в $LOG"

      # 1. Ждём сеть (иногда поднимается не с первого раза)
      step "жду сеть"
      net_ok=0
      for i in $(seq 1 40); do
          # ping есть не везде, поэтому запасной вариант — проверка резолвера
          if ping -c1 -W2 1.1.1.1 >/dev/null 2>&1 || getent hosts archive.ubuntu.com >/dev/null 2>&1; then
              log "сеть есть"; net_ok=1; break
          fi
          [ $((i % 5)) -eq 0 ] && log "  жду сеть... ($i/40)"
          sleep 5
      done
      [ $net_ok -eq 0 ] && log "  ВНИМАНИЕ: сеть не появилась за 3 мин, apt может не сработать"

      # 2. Обновление индекса с повторами
      step "apt-get update"
      for i in 1 2 3; do
          if apt-get update >>"$LOG" 2>&1; then log "apt-get update: ок (попытка $i)"; break; fi
          log "apt-get update не удался, повтор $i"; sleep 10
      done

      # 3. APT-пакеты тяжёлого стека
      step "тяжёлый APT-стек"
      pkgs office libreoffice-writer libreoffice-calc libreoffice-impress
      pkgs tools gdb
      pkgs go     golang
      pkgs rust   rustc cargo
      pkgs node   nodejs npm
      pkgs db     postgresql postgresql-client
      pkgs docker docker.io
      pkgs net    net-tools traceroute

      # 4. Глобальные инструменты
      step "npm и pip"
      if npm install -g typescript >>"$LOG" 2>&1; then log "  готово: typescript (npm)"; OKN=$((OKN+1))
      else log "  ОШИБКА: typescript (npm)"; BADN=$((BADN+1)); FAILED="$FAILED typescript"; fi
      if pip3 install --break-system-packages jupyter jupyterlab >>"$LOG" 2>&1; then
          log "  готово: jupyter jupyterlab"; OKN=$((OKN+1))
      else log "  ОШИБКА: jupyter jupyterlab"; BADN=$((BADN+1)); FAILED="$FAILED jupyter"; fi

      # 5. snap-пакеты (wireshark, VS Code, PyCharm, GeoGebra)
      step "snap-пакеты"
      for i in $(seq 1 40); do
          systemctl is-active --quiet snapd && break
          sleep 3
      done
      for s in "wireshark" "code --classic" "pycharm-community --classic" "geogebra-discovery"; do
          name="${s%% *}"
          log "snap install $s ..."
          if snap install $s >>"$LOG" 2>&1; then log "  готово: $name"; OKN=$((OKN+1))
          else log "  ОШИБКА: $name"; BADN=$((BADN+1)); FAILED="$FAILED snap:$name"; fi
      done

      # 6. Docker без sudo
      step "права docker"
      if usermod -aG docker student; then log "  student добавлен в группу docker"; else log "  ОШИБКА: usermod"; fi

      # 7. Итог; если что-то не поставилось — скрипт оставляем для повтора
      step "итог"
      log "успешно: $OKN, с ошибкой: $BADN"
      [ -n "$FAILED" ] && log "не удалось поставить:$FAILED"
      systemctl disable first-boot-setup.service >>"$LOG" 2>&1
      if [ "$BADN" -gt 0 ]; then
          log "будут неудачные пакеты выше. Повторить вручную:"
          log "  sudo /usr/local/bin/first-boot-setup.sh"
      else
          rm -f /etc/systemd/system/first-boot-setup.service
          rm -f /usr/local/bin/first-boot-setup.sh
          log "всё поставилось, служба первого запуска удалена"
      fi
      log "=========== first boot: конец ==========="
      PFEOF
      chmod +x /target/usr/local/bin/first-boot-setup.sh

    - |
      cat << 'PFEOF' > /target/etc/systemd/system/first-boot-setup.service
      [Unit]
      Description=First boot: heavy dev stack and snap packages
      After=network-online.target snapd.service
      Wants=network-online.target snapd.service

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/first-boot-setup.sh
      RemainAfterExit=yes
      StandardOutput=journal+console
      StandardError=journal+console

      [Install]
      WantedBy=multi-user.target
      PFEOF
    - curtin in-target -- systemctl enable first-boot-setup.service

    # Очистка кэша APT
    - 'echo "[PF: ] очищаю кэш APT"'
    - curtin in-target -- apt-get clean

    # Восстановление штатного DNS-симлинка
    - sh -c "ln -sf ../run/systemd/resolve/stub-resolv.conf /target/etc/resolv.conf"

    # Финальная сводка установки — её видно в install.log
    - 'echo "[PF: ] ===== late-commands завершены ====="'
    - 'echo "[PF: ] далее: перезагрузка и выключение ВМ"'

  # Выключение после установки (QEMU корректно завершится сам)
  shutdown: poweroff
