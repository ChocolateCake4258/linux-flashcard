name: Publish Windows download

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/shellcheck.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Match the release tag to VERSION
        env:
          TAG: ${{ github.ref_name }}
        run: |
          test "${TAG#v}" = "$(tr -d '\r\n' < VERSION)"
      - name: Build the verified Windows archive
        env:
          OUTPUT: ${{ runner.temp }}/release
        run: make release OUTPUT="$OUTPUT"
      - name: Publish archive and SHA256
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          OUTPUT: ${{ runner.temp }}/release
        run: |
          args=(--verify-tag --title "LinuxFlashcard ${TAG#v}" --notes-file CHANGELOG.md)
          if [[ "$TAG" == *-rc* ]]; then args+=(--prerelease); fi
          gh release create "$TAG" "$OUTPUT"/*-windows.zip "$OUTPUT"/*-windows.zip.sha256 "${args[@]}"
